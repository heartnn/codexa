name: Build & Push Docker image

# Mirrored from .github/workflows/docker.yml — keep the two in sync. The registry/image-name
# logic below already auto-detects the forge (via github.server_url, which Forgejo Actions
# also populates), so on Codeberg this pushes to codeberg.org/thj/codexa in Codeberg's
# container package registry instead of ghcr.io — no changes needed there.

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: https://github.com/docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      - name: Determine registry and image name
        id: reg
        run: |
          SERVER="${{ github.server_url }}"
          if [[ "$SERVER" == "https://github.com" ]]; then
            REGISTRY="ghcr.io"
          else
            REGISTRY="${SERVER#https://}"
          fi
          IMAGE="$REGISTRY/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "host=$REGISTRY" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${{ steps.reg.outputs.image }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Official release (git tag vX.Y.Z pushed) — update :latest and the versioned tag.
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            TAGS="${IMAGE}:latest,${IMAGE}:${VERSION}"
          else
            # Plain push to main — publish under :dev only, never touch :latest.
            TAGS="${IMAGE}:dev"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Log in to container registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.host }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push multi-platform image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
